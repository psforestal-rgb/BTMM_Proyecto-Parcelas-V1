name: Temporary QField builder decoder

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode source
        run: |
          python3 - <<'PY'
          import ast
          import base64
          import re
          import zlib
          from pathlib import Path
          wrapper = Path('.github/scripts/build_qfield_package.py').read_text(encoding='utf-8')
          payload = ast.literal_eval(re.search(r'_payload\s*=\s*(".*")', wrapper).group(1))
          Path('decoded_qfield_builder.py').write_bytes(zlib.decompress(base64.b64decode(payload)))
          PY
          nl -ba decoded_qfield_builder.py | tail -80 > decoded_tail.txt
      - uses: actions/upload-artifact@v4
        with:
          name: decoded-qfield-builder
          path: |
            decoded_qfield_builder.py
            decoded_tail.txt
          retention-days: 1
