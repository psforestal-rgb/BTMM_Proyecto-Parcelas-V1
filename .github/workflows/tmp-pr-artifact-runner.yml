name: Temporary PR artifact runner

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin python3-gdal jq
      - name: Configure official 1:5000 WMTS
        run: |
          /usr/bin/python3 - <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          item_id = '12e78177db314a1395e731f51824bc58'
          base = f'https://www.arcgis.com/sharing/rest/content/items/{item_id}'
          with urllib.request.urlopen(base + '?f=json', timeout=120) as r:
              item = json.load(r)
          with urllib.request.urlopen(base + '/data?f=json', timeout=120) as r:
              data = json.load(r)
          Path('arcgis_item.json').write_text(json.dumps(item, ensure_ascii=False, indent=2), encoding='utf-8')
          Path('arcgis_item_data.json').write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(item, ensure_ascii=False, indent=2))
          print(json.dumps(data, ensure_ascii=False, indent=2))
          service_url = item.get('url') or data.get('url')
          if not service_url:
              raise RuntimeError('ArcGIS item did not expose a service URL')
          if 'request=getcapabilities' not in service_url.lower():
              sep = '&' if '?' in service_url else '?'
              service_url += sep + 'SERVICE=WMTS&REQUEST=GetCapabilities&VERSION=1.0.0'
          script_path = Path('.github/scripts/build_qfield_ortho_v2.py')
          text = script_path.read_text(encoding='utf-8')
          import re
          text = re.sub(r"CAPABILITIES_URL = .*", f"CAPABILITIES_URL = {service_url!r}", text, count=1)
          text = re.sub(r"LAYER_ID = .*", "LAYER_ID = 'ortofoto2017_5000_altaresolucionWMTS'", text, count=1)
          text = text.replace("'top_left_x': top_left[0], 'top_left_y': top_left[1]", "'top_left_x': top_left[1], 'top_left_y': top_left[0]")
          text = text.replace('Fuente: IGN/SNIT, Mosaico Ortofotos 1:1.000 2015-2018', 'Fuente: IGN/SNIT, Mosaico Ortofotos 1:5.000 2014-2017 (producción 2015-2018)')
          text = text.replace('ortofoto_snit_2015_2018_area_qfield.tif', 'ortofoto_snit_2014_2017_5k_area_qfield.tif')
          script_path.write_text(text, encoding='utf-8')
          print('WMTS capabilities:', service_url)
          PY
      - name: Build orthophoto
        run: |
          set -o pipefail
          /usr/bin/python3 .github/scripts/build_qfield_ortho_v2.py 2>&1 | tee build.log
      - name: Validate raster content
        run: |
          /usr/bin/python3 - <<'PY'
          from osgeo import gdal
          import sys
          path = 'ortofoto_snit_2014_2017_5k_area_qfield.tif'
          ds = gdal.Open(path)
          if ds is None:
              raise SystemExit('Raster was not created')
          means = []
          stds = []
          for i in range(1, min(3, ds.RasterCount) + 1):
              stats = ds.GetRasterBand(i).GetStatistics(False, True)
              means.append(stats[2]); stds.append(stats[3])
          print('RGB means:', means, 'RGB standard deviations:', stds)
          if not stds or max(stds) < 3:
              raise SystemExit('Raster content appears blank or nearly uniform')
          PY
      - name: Upload raster artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qfield-orthophoto-5k
          path: |
            ortofoto_snit_2014_2017_5k_area_qfield.tif
            raster_info.txt
            SHA256SUMS.txt
            build.log
            wmts_capabilities.xml
            arcgis_item.json
            arcgis_item_data.json
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
