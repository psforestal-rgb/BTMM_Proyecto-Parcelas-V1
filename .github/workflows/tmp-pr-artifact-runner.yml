name: Temporary PR artifact runner

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin python3-gdal
      - name: Build orthophoto
        run: |
          set -o pipefail
          /usr/bin/python3 .github/scripts/build_qfield_ortho_v2.py 2>&1 | tee build.log
      - name: Upload raster artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qfield-orthophoto
          path: |
            ortofoto_snit_2015_2018_area_qfield.tif
            raster_info.txt
            SHA256SUMS.txt
            build.log
            wmts_capabilities.xml
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
